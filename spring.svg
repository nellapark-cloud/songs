<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4F0EE"/>
      <stop offset=".55" stop-color="#F3F5EE"/>
      <stop offset="1" stop-color="#FBF6EF"/>
    </linearGradient>
    <radialGradient id="sun" cx="1180" cy="250" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset=".35" stop-color="#FFF6EA" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFF6EA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6E6D3"/><stop offset="1" stop-color="#C7DCC4"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8D3B2"/><stop offset="1" stop-color="#A6C69F"/></linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#97BD8E"/><stop offset="1" stop-color="#84AE7B"/></linearGradient>
    <linearGradient id="h4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CA672"/><stop offset="1" stop-color="#6B9563"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3E9DA"/><stop offset="1" stop-color="#E9DAC4"/></linearGradient>
    <g id="pine"><path d="M0-58 L14-24 L7-24 L19 4 L-19 4 L-7-24 L-14-24Z"/><rect x="-2.5" y="4" width="5" height="10" fill="#7C6A58"/></g>
    <g id="round"><rect x="-3" y="-6" width="6" height="26" rx="2" fill="#7C6A58"/><circle cx="0" cy="-22" r="22"/><circle cx="-14" cy="-10" r="14"/><circle cx="14" cy="-12" r="15"/></g>
    <g id="blossom">
      <path d="M-3 30 C-2 10 -1 -2 0 -10 M0 4 C8 -4 14 -10 20 -14 M0 10 C-8 2 -14 -4 -20 -8" stroke="#8A7462" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="-30" r="26" fill="#F6D3D8"/><circle cx="-22" cy="-14" r="19" fill="#F2C3CB"/><circle cx="23" cy="-16" r="20" fill="#F8DDE1"/>
      <circle cx="-8" cy="-44" r="15" fill="#FBE6E9"/><circle cx="12" cy="-40" r="13" fill="#F2C3CB"/>
      <circle cx="-14" cy="-30" r="3" fill="#fff" opacity=".8"/><circle cx="10" cy="-24" r="2.5" fill="#fff" opacity=".8"/><circle cx="20" cy="-34" r="2" fill="#fff" opacity=".8"/>
    </g>
    <g id="petal"><path d="M0 0 C4 -6 10 -4 8 2 C6 7 1 6 0 0Z"/></g>
    <style>
      .p{fill:#F2BFC8;opacity:.85;animation:fall 14s linear infinite}
      .p:nth-of-type(2n){fill:#F8D9DE;animation-duration:18s}
      .p:nth-of-type(3n){animation-duration:22s}
      @keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-260px,520px) rotate(320deg)}}
      .cl{animation:float 40s ease-in-out infinite alternate}
      @keyframes float{to{transform:translateX(60px)}}
      .bird{animation:fly 26s linear infinite}
      @keyframes fly{0%{transform:translate(0,0)}100%{transform:translate(-520px,-40px)}}
      @media (prefers-reduced-motion:reduce){.p,.cl,.bird{animation:none}}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="250" r="260" fill="url(#sun)"/>
  <circle cx="1180" cy="250" r="62" fill="#FFFCF3" opacity=".95"/>

  <!-- clouds -->
  <g class="cl" fill="#fff" opacity=".85">
    <path d="M860 170 h170 a28 28 0 0 0 -30 -34 a40 40 0 0 0 -74 -8 a30 30 0 0 0 -50 14 a26 26 0 0 0 -16 28z"/>
    <path d="M1320 120 h130 a22 22 0 0 0 -24 -26 a32 32 0 0 0 -58 -6 a24 24 0 0 0 -40 12 a20 20 0 0 0 -8 20z" opacity=".8"/>
    <path d="M540 230 h110 a20 20 0 0 0 -22 -22 a28 28 0 0 0 -50 -4 a20 20 0 0 0 -38 26z" opacity=".7"/>
  </g>

  <!-- birds -->
  <g class="bird" stroke="#6F8574" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M1300 300 q9 -9 18 0 q9 -9 18 0"/>
    <path d="M1350 330 q7 -7 14 0 q7 -7 14 0"/>
    <path d="M1270 340 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- far hills -->
  <path d="M0 520 C180 440 360 450 520 490 C700 535 820 420 1000 430 C1180 440 1300 500 1600 450 L1600 900 L0 900Z" fill="url(#h1)"/>
  <g fill="#B5CFB0">
    <use href="#pine" x="860" y="452" transform="scale(1)"/><use href="#pine" x="885" y="458"/><use href="#pine" x="1060" y="440"/>
    <use href="#pine" x="1085" y="446"/><use href="#pine" x="1110" y="452"/><use href="#pine" x="300" y="470"/><use href="#pine" x="325" y="476"/>
  </g>

  <!-- mid hills -->
  <path d="M0 610 C200 540 380 560 560 600 C760 645 900 560 1100 560 C1300 560 1420 610 1600 580 L1600 900 L0 900Z" fill="url(#h2)"/>
  <g fill="#8FB487">
    <use href="#round" x="1000" y="566"/><use href="#round" x="1040" y="572"/><use href="#round" x="140" y="590"/>
  </g>
  <use href="#blossom" x="1180" y="560"/>
  <use href="#blossom" x="1240" y="575" transform="translate(1240 575) scale(.75) translate(-1240 -575)"/>

  <!-- near hills -->
  <path d="M0 700 C220 640 420 660 640 700 C860 740 1000 660 1220 660 C1400 660 1500 700 1600 690 L1600 900 L0 900Z" fill="url(#h3)"/>
  <!-- winding path -->
  <path d="M1110 668 C1080 700 1150 720 1100 760 C1050 800 1180 840 1120 900 L1260 900 C1300 840 1170 800 1230 760 C1280 720 1150 700 1140 668Z" fill="url(#path)" opacity=".9"/>
  <g fill="#6E9A66">
    <use href="#round" x="520" y="686" transform="translate(520 686) scale(1.4) translate(-520 -686)"/>
    <use href="#round" x="1420" y="676" transform="translate(1420 676) scale(1.2) translate(-1420 -676)"/>
  </g>
  <use href="#blossom" x="1480" y="690" transform="translate(1480 690) scale(1.5) translate(-1480 -690)"/>
  <use href="#blossom" x="760" y="710" transform="translate(760 710) scale(1.2) translate(-760 -710)"/>

  <!-- foreground meadow -->
  <path d="M0 800 C260 760 520 780 760 810 C980 838 1200 790 1600 800 L1600 900 L0 900Z" fill="url(#h4)"/>
  <g stroke="#5E8A57" stroke-width="2" stroke-linecap="round">
    <path d="M90 840 l-6 -18 M96 840 l2 -20 M102 840 l8 -16"/>
    <path d="M410 830 l-5 -16 M416 830 l3 -18 M422 830 l7 -14"/>
    <path d="M980 840 l-6 -18 M986 840 l2 -20 M992 840 l8 -16"/>
    <path d="M1330 836 l-5 -16 M1336 836 l3 -18 M1342 836 l7 -14"/>
  </g>
  <!-- little flowers -->
  <g>
    <g fill="#fff"><circle cx="120" cy="828" r="4"/><circle cx="260" cy="846" r="3.5"/><circle cx="640" cy="842" r="4"/><circle cx="880" cy="850" r="3.5"/><circle cx="1180" cy="846" r="4"/><circle cx="1520" cy="838" r="3.5"/></g>
    <g fill="#F2BFC8"><circle cx="180" cy="852" r="4"/><circle cx="470" cy="846" r="3.5"/><circle cx="720" cy="860" r="4"/><circle cx="1050" cy="858" r="3.5"/><circle cx="1400" cy="852" r="4"/></g>
    <g fill="#D9CDEB"><circle cx="330" cy="862" r="3.5"/><circle cx="560" cy="866" r="3"/><circle cx="1260" cy="864" r="3.5"/><circle cx="1570" cy="866" r="3"/></g>
    <g fill="#F6E7B8"><circle cx="120" cy="828" r="1.5"/><circle cx="640" cy="842" r="1.5"/><circle cx="1180" cy="846" r="1.5"/></g>
  </g>

  <!-- falling petals -->
  <g>
    <use class="p" href="#petal" x="1250" y="420"/>
    <use class="p" href="#petal" x="1380" y="380" style="animation-delay:-4s"/>
    <use class="p" href="#petal" x="1500" y="460" style="animation-delay:-8s"/>
    <use class="p" href="#petal" x="1120" y="360" style="animation-delay:-2s"/>
    <use class="p" href="#petal" x="1560" y="340" style="animation-delay:-11s"/>
    <use class="p" href="#petal" x="980" y="420" style="animation-delay:-6s"/>
    <use class="p" href="#petal" x="1440" y="520" style="animation-delay:-13s"/>
    <use class="p" href="#petal" x="840" y="380" style="animation-delay:-9s"/>
  </g>
</svg>
